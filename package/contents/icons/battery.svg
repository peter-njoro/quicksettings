<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128">
  <title>quick settings battery</title>
  <desc>Theme-aware frosted glass battery icon with a 75 percent charge.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".15"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff08a"/>
      <stop offset="1" stop-color="#28c76f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="inside">
      <rect x="15" y="34" width="88" height="60" rx="14"/>
    </clipPath>
  </defs>

  <!-- Battery terminal -->
  <rect x="106" y="52" width="9" height="24" rx="4.5"
        fill="currentColor" fill-opacity=".22"
        stroke="currentColor" stroke-opacity=".58" stroke-width="2"/>

  <!-- Glass casing -->
  <g filter="url(#softShadow)">
    <rect x="9" y="27" width="100" height="74" rx="21"
          fill="url(#glass)" stroke="currentColor"
          stroke-opacity=".72" stroke-width="3"/>
    <rect x="14" y="32" width="90" height="64" rx="16"
          fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
  </g>

  <!-- Charge level: 75% -->
  <g clip-path="url(#inside)">
    <rect x="15" y="34" width="66" height="60" rx="13"
          fill="url(#charge)"/>
    <rect x="15" y="34" width="88" height="60" rx="14"
          fill="url(#shine)"/>
  </g>

  <!-- Inner rim and soft highlight -->
  <rect x="15" y="34" width="88" height="60" rx="14"
        fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M25 35.5h65c5.5 0 9.5 3.8 10.8 8.5"
        fill="none" stroke="#fff" stroke-opacity=".62"
        stroke-width="2.5" stroke-linecap="round"/>
</svg>
